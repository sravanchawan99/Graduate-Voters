<main class="admin-page">

  <section class="login-card">

    <div class="brand">
      <span class="brand-mark"><img src="/assets/the-voter-logo.png" alt="The Voter logo"></span>
      <span>Graduate Voter 2026</span>
    </div>

    <span class="eyebrow">
      PRIVATE ADMIN AREA
    </span>

    <h1>
      Admin Login
    </h1>

    <p class="intro">
      Sign in to access the registration dashboard.
    </p>

    <form
      (ngSubmit)="signIn()"
      novalidate
    >

      <label for="username">
        Username
      </label>

      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        placeholder="Enter your username"
        [(ngModel)]="username"
      >

      <label for="password">
        Admin Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter admin password"
        [(ngModel)]="password"
      >

      @if (errorMessage()) {
        <p class="error">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        class="login-btn"
        [disabled]="isSubmitting()"
      >
        {{ isSubmitting() ? 'Signing in...' : 'Sign In' }}
        <span>→</span>
      </button>

    </form>

    <a
      class="back-link"
      routerLink="/"
    >
      ← Back to website
    </a>

  </section>

</main>
